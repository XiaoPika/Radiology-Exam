worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Upload size limit for DICOM files
    client_max_body_size 800M;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    server {
        listen 80;
        server_name _;

        location ~ /\.(?!well-known) {
            return 404;
        }

        location ~ ^/(src|@vite|node_modules)/ {
            return 404;
        }

        location ~* ^/(Dockerfile|docker-compose\.yml|package(-lock)?\.json|vite\.config\.ts|tsconfig(\.node)?\.json|README\.md|handoff\.md)$ {
            return 404;
        }

        location ~* \.(tsx?|jsx?|map|css|wasm|json|ya?ml|env|md|php|xml|txt|svg|ico)$ {
            return 404;
        }

        # Built frontend assets live only under /assets/.
        location ^~ /assets/ {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location ^~ /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }
}
